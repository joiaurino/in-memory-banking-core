name: Build, Test & Auto-Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run JUnit 5 Tests & Package JAR
        run: mvn package -B -Dmaven.wagon.http.retryHandler.count=3

      - name: Automatic Semantic Versioning & GitHub Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: maven
          package-name: in-memory-banking-core
          bump-minor-pre-major: true

      - name: Upload JAR to Release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: target/in-memory-banking-core-${{ steps.release.outputs.version }}.jar
          asset_name: in-memory-banking-core-${{ steps.release.outputs.version }}.jar
          asset_content_type: application/java-archive